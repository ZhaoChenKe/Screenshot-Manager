name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
      - 'V*'
      - '*Version*'
      - '*Manage*'
  release:
    types: [published, created]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare environment and keystore
        run: |
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build APK with Gradle
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: |
          mkdir -p release_apks
          VERSION_TAG=${GITHUB_REF#refs/tags/}
          [ -z "$VERSION_TAG" ] || [ "$VERSION_TAG" = "refs/heads/main" ] && VERSION_TAG="latest"
          cp app/build/outputs/apk/debug/*.apk release_apks/screenshot-manager-${VERSION_TAG}.apk

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
        with:
          files: release_apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
